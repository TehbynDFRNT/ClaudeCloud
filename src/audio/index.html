<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Soundtrack renderer</title>
<link rel="icon" href="data:,">
<style>html, body { margin: 0; background: #000; color: #9ab; font: 13px monospace; } pre { padding: 12px; }</style>
</head>
<body>
<pre id="log">soundtrack renderer — driven by tools/render-audio.mjs</pre>
<script type="module">
import { renderSoundtrack, wav } from './score.js';

const logEl = document.getElementById('log');
const log = (s) => { console.log(s); logEl.textContent += '\n' + s; };

async function post(path, buf) {
  const r = await fetch('/__write?path=' + encodeURIComponent(path), { method: 'POST', body: buf });
  if (!r.ok) throw new Error(`write ${path}: ${r.status} ${await r.text()}`);
}

// Renders everything and writes out/audio/mix.wav (24-bit PCM) + out/audio/stems/*.wav (32-bit float).
// only: [stem names] renders just those stems, raw (development); mix.wav is then their 32-bit float sum.
window.renderAudio = async ({ outDir = 'out/audio', stems = true, only = null } = {}) => {
  const { mix, stems: st, report } = await renderSoundtrack({ base: '/', log, only });
  await post(`${outDir}/mix.wav`, only ? wav(mix[0], mix[1], { float: true }) : wav(mix[0], mix[1], { bits: 24, seed: 3986 }));
  log(`wrote ${outDir}/mix.wav`);
  if (stems) for (const [name, ch] of Object.entries(st)) {
    await post(`${outDir}/stems/${name}.wav`, wav(ch[0], ch[1], { float: true }));
    log(`wrote ${outDir}/stems/${name}.wav`);
  }
  return report;
};
window.__audioReady = true;
</script>
</body>
</html>
